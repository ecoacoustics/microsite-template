{{- $verifyURL := .verifyURL | default "/verify/" -}}

<div class="progress-counter-gauge">
    <svg class="progress-counter-gauge-svg" viewBox="0 0 200 110" aria-hidden="true">
        <path class="progress-counter-gauge-track" d="M 30 100 A 70 70 0 0 1 170 100" pathLength="100" />
        <path class="progress-counter-gauge-progress" d="M 30 100 A 70 70 0 0 1 170 100" pathLength="100" />
        <circle class="progress-counter-pivot" cx="100" cy="100" r="6" />
        <g class="progress-counter-needle">
            <line x1="100" y1="100" x2="100" y2="40" />
        </g>
    </svg>
    <p class="progress-counter-fraction" data-progress-fraction>-- out of -- events verified.</p>
    <p class="progress-counter-status" data-progress-status role="status" aria-live="polite">Loading live progress...</p>
    <sl-button href="{{ $verifyURL }}" variant="primary" pill>
        Keep Contributing
        <sl-icon slot="suffix" name="arrow-right" aria-hidden="true"></sl-icon>
    </sl-button>
</div>
