baseURL: https://calldetective-microsite-example.org/
title: Microsite Template Map Example
theme: microsite-template
module:
  hugoVersion:
    extended: false
    min: 0.166.0
markup:
  goldmark:
    renderer:
      unsafe: true
params:
  api_host: https://api.staging.ecosounds.org
  workbench_host: https://staging.ecosounds.org
  workbench_name: Staging
  tasks:
    verification: false
security:
  funcs:
    getenv:
      - "^HUGO_"
      - "^CI$"
      - "^GOOGLE_MAPS_API_KEY$"
      - "^GOOGLE_MAPS_MAP_ID$"
